name: mausam
description: Mausam — Personalized Weather App for every lifestyle.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.4.3
  geolocator: ^11.0.0
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0
  lottie: ^3.1.0
  fl_chart: ^0.68.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  go_router: ^13.2.0
  flutter_svg: ^2.0.10+1
  permission_handler: ^11.3.1
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  url_launcher: ^6.2.6
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/animations/

